<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cair em uma Fria — Keymaster</title><link rel="stylesheet" href="shared.css">
<script src="config.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="state.js"></script><script src="gm-data.js"></script><script src="realtime.js"></script></head>
<body><div id="login" class="login"><div class="eyebrow">ACESSO DO NARRADOR</div><h2>KEYMASTER</h2><label>Sala</label><input id="room"><div id="firebaseLogin" class="hidden"><label>Email do narrador</label><input id="email" type="email"><label>Senha Firebase</label><input id="password" type="password"></div><div id="localLogin"><label>Credencial local</label><input id="localPassword" type="password" placeholder="credencial"></div><button class="btn gold" onclick="KM.connect()">ENTRAR</button></div>
<div id="console" class="app hidden"><header class="top"><div class="brand"><small>DCX // KEYMASTER // REALTIME</small><b>CAIR EM UMA FRIA — CONTROLE DA SESSÃO</b></div><div class="actions"><span class="btn" id="mode">OFFLINE</span><span class="btn">SALA: <b id="roomLabel"></b></span></div></header><div class="roomBar"><b>LINK DOS JOGADORES</b><input id="playerUrl" style="max-width:none;flex:1" readonly><button class="btn" onclick="KM.copyLink()">COPIAR</button></div>
<div class="kmGrid"><aside class="side"><h3>VISIBILIDADE</h3><div id="visibility"></div><div class="group"><h3>FOCO GLOBAL</h3><div class="actions"><button class="btn" onclick="KM.focus(0)">01</button><button class="btn" onclick="KM.focus(1)">02</button><button class="btn" onclick="KM.focus(2)">03</button><button class="btn" onclick="KM.focus(3)">04</button><button class="btn" onclick="KM.focus(4)">05</button><button class="btn" onclick="KM.focus(5)">06</button><button class="btn" onclick="KM.focus(6)">07</button></div></div><div class="group"><h3>EVENTOS</h3><button class="btn red" onclick="KM.fireH01()">H-01 ATIVIDADE</button> <button class="btn red" onclick="KM.fireN02()">N-02 DETECTADO</button><input id="customTitle" placeholder="Título do alerta" style="width:100%;margin-top:7px;background:#050a0f;border:1px solid #354d62;color:#fff;border-radius:8px;padding:8px"><input id="customBody" placeholder="Mensagem" style="width:100%;margin-top:6px;background:#050a0f;border:1px solid #354d62;color:#fff;border-radius:8px;padding:8px"><button class="btn" style="margin-top:6px" onclick="KM.custom()">DISPARAR</button></div></aside>
<main><section class="adminPanel"><h2>ABORDAGENS</h2><div class="adminList" id="approachCtl"></div></section><section class="adminPanel" style="margin-top:12px"><h2 id="prepCtlTitle">Preparações</h2><div id="prepCtl"></div></section><section class="adminPanel" style="margin-top:12px"><h2>N-02 // KEYMASTERS</h2><div class="actions"><button class="btn" onclick="KM.imageMode('hidden')">Imagem oculta</button><button class="btn" onclick="KM.imageMode('partial')">Parcial</button><button class="btn" onclick="KM.imageMode('full')">Completa</button><button class="btn" onclick="KM.imageMode('auto')">Auto</button></div><div class="adminList" id="clueCtl" style="margin-top:10px"></div></section><section class="adminPanel" style="margin-top:12px"><h2>CHAVES ENVIADAS PELOS JOGADORES</h2><div id="requests"></div></section><section class="adminPanel" style="margin-top:12px"><h2>H-01 // SIMULAÇÃO GLOBAL</h2><input type="range" id="emLevel" min="0" max="3" value="0" onchange="KM.emergency(this.value)"><p id="emLevelLabel" style="color:#9fb1c1"></p></section></main></div></div><div class="toast" id="toast"></div><script src="keymaster.js"></script></body></html>
